[project]
name = "ai-field-developer-excercise"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "mcp[cli]>=2,<3",
    "pydantic>=2,<3",
    "pyjwt>=2.15.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Keep correctness checks explicit; avoid unrelated repository-wide style edits.
select = ["E4", "E7", "E9", "F"]
